    <text x="72" y="330" font-family="DejaVu Sans, sans-serif" font-size="64" font-weight="800" fill="#10231A" text-anchor="start" opacity="1"><tspan x="72" dy="0">A experiência dos</tspan><tspan x="72" dy="71.68">clientes também</tspan><tspan x="72" dy="71.68">conta sua história.</tspan></text>
    <text x="72" y="585" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#516259" text-anchor="start" opacity="1"><tspan x="72" dy="0">Depoimentos verdadeiros dão contexto</tspan><tspan x="72" dy="39">ao trabalho que sua empresa entrega.</tspan></text>
