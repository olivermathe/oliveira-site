    <text x="72" y="330" font-family="DejaVu Sans, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" text-anchor="start" opacity="1"><tspan x="72" dy="0">O resultado da busca</tspan><tspan x="72" dy="71.68">já apresenta</tspan><tspan x="72" dy="71.68">a sua marca.</tspan></text>
    <text x="72" y="570" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#FFFFFF" text-anchor="start" opacity="0.78"><tspan x="72" dy="0">Título e resumo ajudam a explicar</tspan><tspan x="72" dy="39">o que a pessoa encontrará na página.</tspan></text>
